# fps1.ini - se pasa con: hatari --parse fps1.ini <juego>
# Mide los FPS continuamente (cada 150 VBLs ~ 3 s) y los va imprimiendo.
# Juega normal y lee el valor cuando estes en la escena que quieras.
echo === MIDIENDO FPS cada ~3 s (Ikbdws). Juega normal... ===
r v0='0'
r v1='VBL'
b XbiosOpcode = 0x19 :trace :file fps_count.ini
b VBL = 'VBL+150' :trace :once :file fps_report.ini
